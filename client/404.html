<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rotterdam Marathon Supporter</title>
    <!-- Base href for GitHub Pages -->
    <base href="/marathon_runner/">
    <script type="text/javascript">
      // SPA Redirect Script for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // Keeps /marathon_runner/ but removes everything after

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Marathon Runner Supporter app...</p>
  </body>
</html>
