<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Zie waar en wanneer je je loper kunt aanmoedigen: doorkomsttijden per metro-, tram- en treinhalte langs het marathonparcours. Gratis en onofficieel." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Supporter" />

    <!-- Link preview (WhatsApp, Strava, social) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marathon Supporter" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:url" content="https://marathon-supporter.com/" />
    <meta property="og:title" content="Marathon Supporter: zie je loper vaker dan één keer" />
    <meta property="og:description" content="Vul startgolf en tempo in en zie hoe laat je loper langs elke halte op het parcours komt. Deel het plan met één link." />
    <meta property="og:image" content="https://marathon-supporter.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marathon Supporter: doorkomsttijden per halte langs het parcours" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      // Counterpart of the encoder in public/404.html (pathSegmentsToKeep = 0).
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body class="min-h-screen bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
