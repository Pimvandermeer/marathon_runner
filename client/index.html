<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Rotterdam Marathon Supporter</title>
    
    <!-- Base href for GitHub Pages -->
    <script>
      // Dynamically set base href for GitHub Pages
      (function() {
        const isGitHubPages = window.location.hostname.includes('github.io');
        if (isGitHubPages) {
          const base = document.createElement('base');
          base.href = '/marathon_runner/';
          document.head.appendChild(base);
        }
      })();
    </script>
    
    <!-- GitHub Pages redirect script for SPA -->
    <script type="text/javascript">
      // Single Page App Redirect Script
      // This script handles redirects for GitHub Pages with SPAs like React
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This script injects a replit badge into the page, please feel free to remove this line -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-badge-v3.js"></script>
  </body>
</html>
